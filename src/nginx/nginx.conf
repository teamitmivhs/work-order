server {
    listen 80;
    server_name _;
    absolute_redirect off;
    resolver 10.89.0.1 valid=30s ipv6=off;

    # Allow profile/documentation photos from mobile cameras.
    # Frontend compresses images, but keep headroom for uncompressed uploads.
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.html$ {
        add_header Cache-Control "no-store";
    }

    # Serve root directly to avoid broken localhost redirects through Podman port forwarding.
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /index {
        return 301 /;
    }

    location = /index.html {
        return 301 /;
    }

    location ~ ^/(login|register|guest|summary|kaizen|techguide|shift|settings|staff)\.html$ {
        return 301 /$1;
    }

    # ===== BACKEND API =====
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        add_header Cache-Control "no-store, private" always;
        add_header Pragma "no-cache" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ===== FRONTEND =====
    location /static/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ $uri.html /index.html;
    }
}
