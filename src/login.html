<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Work Order ITMIVHS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/assets/style.css" />
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .login-bg {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      position: relative;
    }
    .login-bg::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(59,130,246,0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(168,85,247,0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .login-card {
      background: rgba(255,255,255,0.98);
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.35);
    }
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #e5e7eb;
      border-radius: 0.625rem;
      font-size: 16px; /* prevent iOS zoom */
      font-family: 'Poppins', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      background: #f9fafb;
    }
    .input-field:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
      background: #fff;
    }
    .btn-primary {
      width: 100%; padding: 0.875rem 1rem;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff; font-weight: 600; font-size: 0.95rem;
      border: none; border-radius: 0.75rem;
      cursor: pointer; transition: opacity 0.2s, transform 0.15s;
      font-family: 'Poppins', sans-serif;
      min-height: 48px;
    }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-guest {
      width: 100%; padding: 0.75rem 1rem;
      background: transparent;
      color: #64748b; font-weight: 500; font-size: 0.875rem;
      border: 1.5px solid #e2e8f0; border-radius: 0.75rem;
      cursor: pointer; transition: all 0.2s;
      font-family: 'Poppins', sans-serif;
      min-height: 48px;
    }
    .btn-guest:hover { background: #f8fafc; border-color: #cbd5e1; }
  </style>
</head>
<body class="login-bg flex items-center justify-center p-4">

  <div class="login-card w-full max-w-sm p-6 sm:p-8 relative z-10">
    <!-- Logo & heading -->
    <div class="text-center mb-6">
      <img src="static/public/itlogo.png" alt="IT Logo" class="w-16 sm:w-20 mx-auto mb-4" />
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800">Selamat Datang</h1>
      <p class="text-sm text-gray-500 mt-1">Masuk ke Work Order ITMIVHS</p>
    </div>

    <!-- Form -->
    <form class="login-form space-y-4" novalidate>
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username"
          placeholder="Masukkan username" class="input-field" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <div class="relative">
          <input type="password" id="password" name="password" required autocomplete="current-password"
            placeholder="Masukkan password" class="input-field pr-11" />
          <button type="button" id="togglePassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1"
            aria-label="Tampilkan/sembunyikan password">
            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary mt-2">Masuk</button>
    </form>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-4">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-xs text-gray-400 font-medium">atau</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <!-- Guest -->
    <button type="button" id="guestLoginBtn" class="btn-guest">
      Lanjut sebagai Guest
    </button>

    <!-- Register link -->
    <p class="text-center text-sm text-gray-500 mt-5">
      Belum punya akun? <a href="register.html" class="text-blue-600 font-medium hover:underline">Daftar sekarang</a>
    </p>
  </div>

  <!-- Modal -->
  <div id="myModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl relative animate-bounce-in">
      <button class="close absolute top-3 right-4 text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none" aria-label="Tutup">&times;</button>
      <div id="modal-icon" class="w-12 h-12 rounded-full mx-auto mb-3 flex items-center justify-center"></div>
      <p id="modal-message" class="text-center text-sm text-gray-700 font-medium"></p>
    </div>
  </div>

  <script>
    const modal        = document.getElementById('myModal');
    const modalMsg     = document.getElementById('modal-message');
    const modalIcon    = document.getElementById('modal-icon');

    function showModal(message, isError = false) {
      modalMsg.textContent = message;
      modalIcon.className = 'w-12 h-12 rounded-full mx-auto mb-3 flex items-center justify-center ' +
        (isError ? 'bg-red-100' : 'bg-green-100');
      modalIcon.innerHTML = isError
        ? `<svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`
        : `<svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
      modal.classList.remove('hidden');
    }
    function hideModal() { modal.classList.add('hidden'); }

    document.querySelector('.close').addEventListener('click', hideModal);
    modal.addEventListener('click', e => { if (e.target === modal) hideModal(); });

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function () {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    // Guest login
    document.getElementById('guestLoginBtn').addEventListener('click', function () {
      localStorage.setItem('isGuestUser', 'true');
      localStorage.setItem('guestLoginTime', new Date().toISOString());
      showModal('Welcome Guest! Kamu hanya bisa membuat work order.');
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    });

    // Login form
    document.querySelector('.login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const submitBtn = this.querySelector('[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';

      const name     = this.username.value.trim();
      const password = this.password.value;

      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, password })
      })
      .then(r => r.json())
      .then(data => {
        if (data.data && data.data.token) {
          localStorage.removeItem('isGuestUser');
          localStorage.removeItem('guestLoginTime');
          localStorage.setItem('isAdmin', 'true');
          localStorage.setItem('userToken', data.data.token);
          showModal('Login berhasil! Mengalihkan...');
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
          showModal(data.message || 'Login gagal. Periksa username & password.', true);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Masuk';
        }
      })
      .catch(() => {
        showModal('Terjadi kesalahan. Coba lagi.', true);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk';
      });
    });
  </script>
</body>
</html>
