services:

  # ─── Rust Time Tracker ─────────────────────────────────────────────────────
  time-tracker:
    build:
      context: ./rust-engine
      dockerfile: Dockerfile
    container_name: work-order-time-tracker
    restart: unless-stopped
    environment:
      PORT: "9000"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    expose:
      - "9000"
    networks:
      - workorder-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Go Backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: work-order-backend
    restart: unless-stopped
    depends_on:
      time-tracker:
        # FIX: tunggu time-tracker healthy, bukan hanya started
        condition: service_healthy
    env_file: .env
    environment:
      # MySQL external di host/server lain — DB_HOST diisi dari .env
      DB_HOST:          ${DB_HOST:-localhost}
      DB_PORT:          ${DB_PORT:-3306}
      DB_USER:          ${DB_USER}
      DB_PASSWORD:      ${DB_PASSWORD}
      DB_NAME:          ${DB_NAME:-dbwoit}
      JWT_SECRET:       ${JWT_SECRET}
      TIME_TRACKER_URL: "http://time-tracker:9000"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    expose:
      - "8080"
    networks:
      - workorder-net
    volumes:
      - ./static:/static:z
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: work-order-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4323:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./index.html:/usr/share/nginx/html/index.html:ro,Z
      - ./login.html:/usr/share/nginx/html/login.html:ro,Z
      - ./register.html:/usr/share/nginx/html/register.html:ro,Z
      - ./guest.html:/usr/share/nginx/html/guest.html:ro,Z
      - ./summary.html:/usr/share/nginx/html/summary.html:ro,Z
      - ./kaizen.html:/usr/share/nginx/html/kaizen.html:ro,Z
      - ./techguide.html:/usr/share/nginx/html/techguide.html:ro,Z
      - ./static:/usr/share/nginx/html/static:ro,z
      - ./settings.html:/usr/share/nginx/html/settings.html:ro,Z
      - ./staff.html:/usr/share/nginx/html/staff.html:ro,Z
    networks:
      - workorder-net

networks:
  workorder-net:
    driver: bridge
