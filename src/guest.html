<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Guest Work Order — ITMIVHS</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link href="/static/assets/style.css" rel="stylesheet" />
        <script>
            (function () {
                try {
                    var theme =
                        localStorage.getItem("woTheme") ||
                        localStorage.getItem("theme") ||
                        "light";
                    document.documentElement.setAttribute("data-theme", theme);
                } catch (e) {}
            })();
        </script>
        <style>
            body {
                font-family: "Poppins", sans-serif;
                min-height: 100vh;
                background: linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #1e293b 44%,
                    #0f4c81 100%
                );
                color: #0f172a;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background-image:
                    linear-gradient(
                        rgba(255, 255, 255, 0.05) 1px,
                        transparent 1px
                    ),
                    linear-gradient(
                        90deg,
                        rgba(255, 255, 255, 0.05) 1px,
                        transparent 1px
                    );
                background-size: 46px 46px;
                mask-image: linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.86),
                    transparent 82%
                );
            }
            @keyframes guestIn {
                from {
                    opacity: 0;
                    transform: translateY(14px) scale(0.99);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }
            .guest-shell {
                animation: guestIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .guest-panel {
                background: rgba(255, 255, 255, 0.96);
                border: 1px solid rgba(226, 232, 240, 0.9);
                border-radius: 0.9rem;
                box-shadow: 0 28px 80px rgba(2, 6, 23, 0.34);
                backdrop-filter: blur(18px);
            }
            .guest-input {
                width: 100%;
                min-height: 46px;
                border: 1.5px solid #dbe3ee;
                border-radius: 0.7rem;
                background: #f8fafc;
                padding: 0.75rem 0.9rem;
                font-size: 16px;
                outline: none;
                transition:
                    border-color 0.18s,
                    box-shadow 0.18s,
                    background 0.18s;
            }
            .guest-input:focus {
                border-color: #93c5fd;
                box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
                background: #fff;
            }
            .priority-card {
                border: 1.5px solid #dbe3ee;
                border-radius: 0.75rem;
                background: #f8fafc;
                padding: 0.85rem 0.75rem;
                text-align: center;
                cursor: pointer;
                transition:
                    border-color 0.18s,
                    background 0.18s,
                    transform 0.18s;
            }
            .priority-card:hover {
                transform: translateY(-1px);
            }
            .priority-opt input:checked + .priority-card {
                border-color: #2563eb;
                background: #eff6ff;
            }
            .guest-tabs {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
                padding: 0.75rem;
                background: #f8fafc;
                border-bottom: 1px solid #e2e8f0;
            }
            .guest-tab {
                min-height: 42px;
                border-radius: 0.75rem;
                color: #64748b;
                font-weight: 700;
                font-size: 0.88rem;
                transition:
                    background 0.18s,
                    color 0.18s,
                    box-shadow 0.18s;
            }
            .guest-tab.active {
                background: #0f172a;
                color: #fff;
                box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
            }
            .track-card {
                border: 1px solid #e2e8f0;
                border-radius: 0.9rem;
                background: #f8fafc;
                padding: 0.9rem;
            }
            .track-status {
                display: inline-flex;
                align-items: center;
                min-height: 1.65rem;
                padding: 0 0.65rem;
                border-radius: 999px;
                font-size: 0.72rem;
                font-weight: 800;
                text-transform: uppercase;
            }
            .track-status-pending {
                background: #fef3c7;
                color: #92400e;
            }
            .track-status-progress {
                background: #dbeafe;
                color: #1d4ed8;
            }
            .track-status-completed {
                background: #dcfce7;
                color: #166534;
            }
            .tracking-modal-panel {
                width: min(100%, 22rem);
                border-radius: 1rem;
                background: #fff;
                box-shadow: 0 28px 80px rgba(2, 6, 23, 0.38);
            }
            .tracking-code-box {
                border: 1px dashed #93c5fd;
                border-radius: 0.85rem;
                background: #eff6ff;
                color: #1d4ed8;
                font-size: 1.55rem;
                font-weight: 900;
                letter-spacing: 0.08em;
                text-align: center;
                padding: 0.9rem;
            }
            html[data-theme="dark"] .tracking-modal-panel {
                color-scheme: light;
                background: #fff !important;
                color: #0f172a !important;
            }
            .toast {
                animation: guestIn 0.2s ease both;
            }
            html[data-theme="dark"] .guest-bg {
                background: linear-gradient(
                    135deg,
                    #0f172a 0%,
                    #1e293b 44%,
                    #0f4c81 100%
                ) !important;
                color: #0f172a !important;
            }
            html[data-theme="dark"] .guest-panel {
                color-scheme: light;
                background: rgba(255, 255, 255, 0.96) !important;
                border-color: rgba(226, 232, 240, 0.9) !important;
                color: #0f172a !important;
            }
            html[data-theme="dark"] .guest-panel .text-gray-700 {
                color: #374151 !important;
            }
            html[data-theme="dark"] .guest-panel .text-gray-500 {
                color: #64748b !important;
            }
            html[data-theme="dark"] .guest-panel .text-green-700 {
                color: #15803d !important;
            }
            html[data-theme="dark"] .guest-panel .text-yellow-700 {
                color: #a16207 !important;
            }
            html[data-theme="dark"] .guest-panel .text-red-700 {
                color: #b91c1c !important;
            }
            html[data-theme="dark"] .guest-panel .guest-input {
                background: #f8fafc !important;
                border-color: #dbe3ee !important;
                color: #0f172a !important;
            }
            html[data-theme="dark"] .guest-panel .guest-input:focus {
                background: #fff !important;
                border-color: #93c5fd !important;
                box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1) !important;
            }
            html[data-theme="dark"] .guest-panel .guest-input::placeholder {
                color: #94a3b8 !important;
            }
            html[data-theme="dark"] .guest-panel .priority-card {
                background: #f8fafc !important;
                border-color: #dbe3ee !important;
            }
            html[data-theme="dark"] .guest-panel .guest-tabs {
                background: #f8fafc !important;
                border-color: #e2e8f0 !important;
            }
            html[data-theme="dark"] .guest-panel .guest-tab:not(.active) {
                color: #64748b !important;
            }
            html[data-theme="dark"] .guest-panel .track-card {
                background: #f8fafc !important;
                border-color: #e2e8f0 !important;
                color: #0f172a !important;
            }
            html[data-theme="dark"]
                .guest-panel
                .priority-opt
                input:checked
                + .priority-card {
                background: #eff6ff !important;
                border-color: #2563eb !important;
            }
            html[data-theme="dark"] .guest-panel .border-gray-300 {
                border-color: #d1d5db !important;
            }
            html[data-theme="dark"] .guest-panel .text-gray-600 {
                color: #4b5563 !important;
            }
            @media (max-width: 640px) {
                .guest-shell {
                    align-items: flex-start;
                    padding: 2.5rem 1rem 1rem;
                }
                .guest-panel {
                    border-radius: 0.8rem;
                }
                .guest-panel header {
                    padding: 1rem 1.1rem;
                }
                .guest-panel h1 {
                    font-size: 1.15rem;
                }
                #guestOrderForm {
                    padding: 1rem 1.1rem 1.1rem;
                    gap: 0;
                }
                #guestStatusPanel {
                    padding: 1rem 1.1rem 1.1rem;
                }
                #guestOrderForm > * + * {
                    margin-top: 0.85rem;
                }
                #guestOrderForm label {
                    margin-bottom: 0.35rem;
                    font-size: 0.72rem;
                }
                .guest-input {
                    min-height: 42px;
                    padding: 0.62rem 0.85rem;
                    border-radius: 0.68rem;
                }
                .priority-card {
                    min-height: 46px;
                    padding: 0.65rem 0.45rem;
                    border-radius: 0.68rem;
                }
                #guestProblem {
                    min-height: 88px;
                }
                #clearGuestFormBtn,
                #submitGuestOrderBtn {
                    min-height: 44px;
                    padding-top: 0.65rem;
                    padding-bottom: 0.65rem;
                    border-radius: 0.8rem;
                }
            }
        </style>
    </head>
    <body class="guest-bg relative">
        <main
            class="guest-shell relative z-10 min-h-screen flex items-center justify-center px-4 py-6"
        >
            <section class="guest-panel w-full max-w-2xl overflow-hidden">
                <header
                    class="px-5 sm:px-6 py-5 bg-slate-950 text-white flex items-start justify-between gap-4"
                >
                    <div>
                        <p
                            class="text-xs uppercase tracking-wide text-blue-300 font-semibold"
                        >
                            Guest Request
                        </p>
                        <h1 class="text-xl sm:text-2xl font-bold mt-1">
                            Buat Work Order
                        </h1>
                    </div>
                    <button
                        id="exitGuestBtn"
                        type="button"
                        class="text-sm font-semibold text-slate-300 hover:text-white border border-white/10 rounded-lg px-3 py-2"
                    >
                        Keluar
                    </button>
                </header>

                <div class="guest-tabs" role="tablist" aria-label="Guest work order">
                    <button
                        type="button"
                        class="guest-tab active"
                        id="guestCreateTab"
                        aria-selected="true"
                    >
                        Buat Order
                    </button>
                    <button
                        type="button"
                        class="guest-tab"
                        id="guestTrackTab"
                        aria-selected="false"
                    >
                        Cek Status
                    </button>
                </div>

                <form
                    id="guestOrderForm"
                    class="px-5 sm:px-6 py-5 sm:py-6 space-y-5"
                >
                    <div>
                        <label
                            class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2"
                            >Klasifikasi</label
                        >
                        <div class="grid grid-cols-3 gap-2">
                            <label class="priority-opt">
                                <input
                                    class="sr-only"
                                    type="radio"
                                    name="priority"
                                    value="low"
                                />
                                <div class="priority-card">
                                    <span
                                        class="block text-sm font-semibold text-green-700"
                                        >Low</span
                                    >
                                </div>
                            </label>
                            <label class="priority-opt">
                                <input
                                    class="sr-only"
                                    type="radio"
                                    name="priority"
                                    value="medium"
                                    checked
                                />
                                <div class="priority-card">
                                    <span
                                        class="block text-sm font-semibold text-yellow-700"
                                        >Medium</span
                                    >
                                </div>
                            </label>
                            <label class="priority-opt">
                                <input
                                    class="sr-only"
                                    type="radio"
                                    name="priority"
                                    value="high"
                                />
                                <div class="priority-card">
                                    <span
                                        class="block text-sm font-semibold text-red-700"
                                        >High</span
                                    >
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label
                                class="block text-sm font-medium text-gray-700 mb-1.5"
                                for="guestRequester"
                                >Nama Requester</label
                            >
                            <input
                                id="guestRequester"
                                class="guest-input"
                                required
                                autocomplete="name"
                                placeholder="Nama lengkap"
                            />
                        </div>
                        <div>
                            <label
                                class="block text-sm font-medium text-gray-700 mb-1.5"
                                for="guestDevice"
                                >Nama Device</label
                            >
                            <input
                                id="guestDevice"
                                class="guest-input"
                                required
                                placeholder="Contoh: Printer, laptop, proyektor"
                            />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label
                                class="block text-sm font-medium text-gray-700 mb-1.5"
                                for="guestLocation"
                                >Lokasi</label
                            >
                            <select
                                id="guestLocation"
                                class="guest-input"
                                required
                            >
                                <option value="">Pilih lokasi</option>
                                <option value="Gedung A">Gedung A</option>
                                <option value="Gedung B">Gedung B</option>
                                <option value="Gedung B Baru">
                                    Gedung B Baru
                                </option>
                                <option value="Gedung C">Gedung C</option>
                                <option value="Gedung D">Gedung D</option>
                                <option value="Gedung TKI">Gedung TKI</option>
                                <option value="Gedung E">Gedung E</option>
                                <option value="Gedung F">Gedung F</option>
                                <option value="Gedung G">Gedung G</option>
                                <option value="Ruang Guru">Ruang Guru</option>
                                <option value="Ruang Yayasan">
                                    Ruang Yayasan
                                </option>
                                <option value="Ruang Dar Al-Safwa">
                                    Ruang Dar Al-Safwa
                                </option>
                                <option value="Ruang Arafah">
                                    Ruang Arafah
                                </option>
                                <option value="Ruang Horenso">
                                    Ruang Horenso
                                </option>
                            </select>
                        </div>
                        <div>
                            <label
                                class="block text-sm font-medium text-gray-700 mb-1.5"
                                for="guestSpecificLocation"
                                >Detail Lokasi</label
                            >
                            <input
                                id="guestSpecificLocation"
                                class="guest-input"
                                placeholder="Contoh: Lantai 2, ruang 201"
                            />
                        </div>
                    </div>

                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1.5"
                            for="guestProblem"
                            >Deskripsi Masalah</label
                        >
                        <textarea
                            id="guestProblem"
                            class="guest-input min-h-[120px] resize-none"
                            required
                            placeholder="Jelaskan masalah yang terjadi"
                        ></textarea>
                    </div>

                    <div class="flex flex-col-reverse sm:flex-row gap-3 pt-2">
                        <button
                            id="clearGuestFormBtn"
                            type="button"
                            class="w-full sm:w-auto px-5 py-3 rounded-xl border border-gray-300 text-gray-600 font-semibold hover:bg-gray-50"
                        >
                            Reset
                        </button>
                        <button
                            id="submitGuestOrderBtn"
                            type="submit"
                            class="w-full flex-1 px-5 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 shadow-lg shadow-blue-500/20"
                        >
                            Buat Work Order
                        </button>
                    </div>
                </form>

                <section
                    id="guestStatusPanel"
                    class="hidden px-5 sm:px-6 py-5 sm:py-6 space-y-4"
                >
                    <div>
                        <label
                            class="block text-sm font-medium text-gray-700 mb-1.5"
                            for="trackingCodeInput"
                            >Kode Tracking</label
                        >
                        <div class="flex flex-col sm:flex-row gap-2">
                            <input
                                id="trackingCodeInput"
                                class="guest-input uppercase"
                                placeholder="Contoh: WO-K7P9Q2"
                                autocomplete="off"
                            />
                            <button
                                id="trackOrderBtn"
                                type="button"
                                class="px-5 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 shadow-lg shadow-blue-500/20"
                            >
                                Cek
                            </button>
                        </div>
                    </div>
                    <div id="trackResult" class="hidden"></div>
                    <div>
                        <div class="flex items-center justify-between gap-3 mb-2">
                            <h2 class="text-sm font-bold text-gray-700">
                                Order dari perangkat ini
                            </h2>
                            <button
                                id="clearTrackedOrdersBtn"
                                type="button"
                                class="text-xs font-semibold text-gray-500 hover:text-red-600"
                            >
                                Bersihkan
                            </button>
                        </div>
                        <div id="trackedOrdersList" class="space-y-2"></div>
                    </div>
                </section>
            </section>
        </main>

        <div
            id="guestToast"
            class="toast hidden fixed left-4 right-4 bottom-4 sm:left-auto sm:right-5 sm:max-w-sm rounded-xl bg-slate-950 text-white text-sm px-4 py-3 shadow-2xl z-50"
        ></div>

        <div
            id="trackingCodeModal"
            class="hidden fixed inset-0 z-[80] bg-black/60 flex items-center justify-center p-4"
            role="dialog"
            aria-modal="true"
            aria-labelledby="trackingCodeModalTitle"
        >
            <div class="tracking-modal-panel p-5">
                <h2
                    id="trackingCodeModalTitle"
                    class="text-lg font-extrabold text-slate-900"
                >
                    Work Order Berhasil Dibuat
                </h2>
                <p class="mt-2 text-sm leading-relaxed text-slate-600">
                    Simpan kode ini. Kode dipakai untuk cek apakah work order
                    sudah pending, sedang dikerjakan, atau selesai.
                </p>
                <div class="tracking-code-box mt-4" id="createdTrackingCode">
                    -
                </div>
                <p class="mt-3 text-xs text-slate-500">
                    Buka tab <b>Cek Status</b>, lalu masukkan kode ini jika ingin
                    melihat status work order.
                </p>
                <div class="mt-5 grid grid-cols-1 gap-2 sm:grid-cols-2">
                    <button
                        id="copyTrackingCodeBtn"
                        type="button"
                        class="rounded-xl bg-blue-600 px-4 py-3 text-sm font-bold text-white hover:bg-blue-700"
                    >
                        Copy Kode
                    </button>
                    <button
                        id="closeTrackingCodeModal"
                        type="button"
                        class="rounded-xl border border-slate-300 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50"
                    >
                        Saya Simpan
                    </button>
                </div>
            </div>
        </div>

        <script>
            const token = localStorage.getItem("userToken");
            const isGuest = localStorage.getItem("isGuestUser") === "true";

            if (!token) window.location.replace("login.html");
            if (token && !isGuest) window.location.replace("index.html");

            const form = document.getElementById("guestOrderForm");
            const toast = document.getElementById("guestToast");
            const submitBtn = document.getElementById("submitGuestOrderBtn");
            const createTab = document.getElementById("guestCreateTab");
            const trackTab = document.getElementById("guestTrackTab");
            const statusPanel = document.getElementById("guestStatusPanel");
            const trackResult = document.getElementById("trackResult");
            const trackedOrdersList =
                document.getElementById("trackedOrdersList");
            const trackingCodeModal =
                document.getElementById("trackingCodeModal");
            const createdTrackingCode =
                document.getElementById("createdTrackingCode");
            const trackedOrdersKey = "guestTrackedOrders";

            function normalizeTrackingCode(value) {
                return String(value || "").trim().toUpperCase();
            }

            function getTrackedOrders() {
                try {
                    return JSON.parse(
                        localStorage.getItem(trackedOrdersKey) || "[]",
                    );
                } catch (e) {
                    return [];
                }
            }

            function saveTrackedOrder(order) {
                const code = normalizeTrackingCode(order.trackingCode);
                if (!code) return;
                const next = [
                    { ...order, trackingCode: code },
                    ...getTrackedOrders().filter(
                        (item) =>
                            normalizeTrackingCode(item.trackingCode) !== code,
                    ),
                ].slice(0, 8);
                localStorage.setItem(trackedOrdersKey, JSON.stringify(next));
                renderTrackedOrders();
            }

            function statusLabel(status) {
                return (
                    {
                        pending: "Pending",
                        progress: "On Progress",
                        completed: "Completed",
                    }[status] || status || "-"
                );
            }

            function renderTrackCard(order) {
                if (!order) return "";
                return `
                    <div class="track-card">
                        <div class="flex items-start justify-between gap-3">
                            <div>
                                <p class="text-xs font-bold text-gray-500 uppercase tracking-wide">Tracking</p>
                                <p class="text-lg font-extrabold text-slate-900">${order.trackingCode || "-"}</p>
                            </div>
                            <span class="track-status track-status-${order.status || "pending"}">${statusLabel(order.status)}</span>
                        </div>
                        <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
                            <p><span class="font-semibold text-gray-500">Order:</span> #${order.id || "-"}</p>
                            <p><span class="font-semibold text-gray-500">Requester:</span> ${order.requester || "-"}</p>
                            <p><span class="font-semibold text-gray-500">Device:</span> ${order.device || "-"}</p>
                            <p><span class="font-semibold text-gray-500">Lokasi:</span> ${order.location || "-"}</p>
                            <p><span class="font-semibold text-gray-500">Selesai:</span> ${order.completedAt || "-"}</p>
                        </div>
                    </div>`;
            }

            function renderTrackedOrders() {
                const orders = getTrackedOrders();
                if (!orders.length) {
                    trackedOrdersList.innerHTML =
                        '<p class="text-sm text-gray-500 text-center py-4">Belum ada kode tracking di perangkat ini.</p>';
                    return;
                }
                trackedOrdersList.innerHTML = orders
                    .map(
                        (order) => `
                    <button type="button" class="track-card w-full text-left tracked-order-btn" data-code="${order.trackingCode}">
                        <div class="flex items-center justify-between gap-3">
                            <div>
                                <p class="text-sm font-bold text-slate-900">${order.trackingCode}</p>
                                <p class="text-xs text-gray-500">${order.device || "Work order"}${order.createdAt ? " - " + order.createdAt : ""}</p>
                            </div>
                            <span class="text-xs font-bold text-blue-600">Cek</span>
                        </div>
                    </button>`,
                    )
                    .join("");
            }

            function setGuestMode(mode) {
                const isTrack = mode === "track";
                form.classList.toggle("hidden", isTrack);
                statusPanel.classList.toggle("hidden", !isTrack);
                createTab.classList.toggle("active", !isTrack);
                trackTab.classList.toggle("active", isTrack);
                createTab.setAttribute("aria-selected", String(!isTrack));
                trackTab.setAttribute("aria-selected", String(isTrack));
                if (isTrack) renderTrackedOrders();
            }

            function showToast(message, isError = false) {
                toast.textContent = message;
                toast.className =
                    "toast fixed left-4 right-4 bottom-4 sm:left-auto sm:right-5 sm:max-w-sm rounded-xl text-white text-sm px-4 py-3 shadow-2xl z-50 " +
                    (isError ? "bg-red-600" : "bg-slate-950");
                setTimeout(() => toast.classList.add("hidden"), 3200);
            }

            function setLoading(loading) {
                submitBtn.disabled = loading;
                submitBtn.textContent = loading
                    ? "Mengirim..."
                    : "Buat Work Order";
            }

            function showTrackingCodeModal(code) {
                createdTrackingCode.textContent = normalizeTrackingCode(code);
                trackingCodeModal.classList.remove("hidden");
            }

            function closeTrackingCodeModal() {
                trackingCodeModal.classList.add("hidden");
            }

            document
                .getElementById("closeTrackingCodeModal")
                .addEventListener("click", closeTrackingCodeModal);
            trackingCodeModal.addEventListener("click", (event) => {
                if (event.target === trackingCodeModal)
                    closeTrackingCodeModal();
            });
            document
                .getElementById("copyTrackingCodeBtn")
                .addEventListener("click", async () => {
                    const code = createdTrackingCode.textContent.trim();
                    try {
                        await navigator.clipboard.writeText(code);
                    } catch (e) {
                        const input = document.createElement("input");
                        input.value = code;
                        document.body.appendChild(input);
                        input.select();
                        document.execCommand("copy");
                        input.remove();
                    }
                    showToast("Kode tracking disalin.");
                });

            async function trackOrder(code) {
                const trackingCode = normalizeTrackingCode(code);
                if (!trackingCode) {
                    showToast("Masukkan kode tracking.", true);
                    return;
                }
                trackResult.classList.remove("hidden");
                trackResult.innerHTML =
                    '<div class="track-card text-sm text-gray-500">Mengecek status...</div>';
                try {
                    const response = await fetch(
                        `/api/workorders/track/${encodeURIComponent(trackingCode)}`,
                    );
                    if (!response.ok) throw new Error("not found");
                    const json = await response.json();
                    const order = json.data || json;
                    trackResult.innerHTML = renderTrackCard(order);
                    saveTrackedOrder({
                        id: order.id,
                        trackingCode: order.trackingCode,
                        device: order.device,
                        createdAt: order.time,
                    });
                } catch (error) {
                    trackResult.innerHTML =
                        '<div class="track-card text-sm text-red-600 font-semibold">Kode tracking tidak ditemukan.</div>';
                }
            }

            createTab.addEventListener("click", () => setGuestMode("create"));
            trackTab.addEventListener("click", () => setGuestMode("track"));
            document
                .getElementById("trackOrderBtn")
                .addEventListener("click", () =>
                    trackOrder(
                        document.getElementById("trackingCodeInput").value,
                    ),
                );
            document
                .getElementById("trackingCodeInput")
                .addEventListener("keydown", (event) => {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        trackOrder(event.target.value);
                    }
                });
            document
                .getElementById("clearTrackedOrdersBtn")
                .addEventListener("click", () => {
                    localStorage.removeItem(trackedOrdersKey);
                    renderTrackedOrders();
                    trackResult.classList.add("hidden");
                });
            trackedOrdersList.addEventListener("click", (event) => {
                const btn = event.target.closest(".tracked-order-btn");
                if (!btn) return;
                document.getElementById("trackingCodeInput").value =
                    btn.dataset.code;
                trackOrder(btn.dataset.code);
            });

            document
                .getElementById("exitGuestBtn")
                .addEventListener("click", () => {
                    localStorage.removeItem("isGuestUser");
                    localStorage.removeItem("guestLoginTime");
                    localStorage.removeItem("userToken");
                    localStorage.removeItem("isAdmin");
                    window.location.href = "login.html";
                });

            document
                .getElementById("clearGuestFormBtn")
                .addEventListener("click", () => form.reset());

            form.addEventListener("submit", (event) => {
                event.preventDefault();
                if (submitBtn.disabled) return;

                const now = new Date();
                const hh = String(now.getHours()).padStart(2, "0");
                const mm = String(now.getMinutes()).padStart(2, "0");
                const location = document.getElementById("guestLocation").value;
                const specificLocation = document
                    .getElementById("guestSpecificLocation")
                    .value.trim();

                const payload = {
                    priority: form.querySelector(
                        'input[name="priority"]:checked',
                    ).value,
                    time_display: `${hh}:${mm}`,
                    time_sort: `${hh}:${mm}:00`,
                    requester: document
                        .getElementById("guestRequester")
                        .value.trim(),
                    location: specificLocation
                        ? `${location} - ${specificLocation}`
                        : location,
                    device: document.getElementById("guestDevice").value.trim(),
                    problem: document
                        .getElementById("guestProblem")
                        .value.trim(),
                    working_hours: "0 menit",
                    status: "pending",
                    executors: [],
                    safety_checklist: [],
                };

                setLoading(true);
                fetch("/api/workorders", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: "Bearer " + token,
                    },
                    body: JSON.stringify(payload),
                })
                    .then((response) => {
                        if (!response.ok)
                            throw new Error("Gagal membuat work order");
                        return response.json();
                    })
                    .then((json) => {
                        const id =
                            json.data && json.data.id ? json.data.id : "-";
                        const trackingCode =
                            json.data && json.data.trackingCode
                                ? json.data.trackingCode
                                : "";
                        form.reset();
                        saveTrackedOrder({
                            id,
                            trackingCode,
                            device: payload.device,
                            createdAt: payload.time_display,
                        });
                        showToast(
                            trackingCode
                                ? `Work Order #${id} berhasil dibuat. Kode: ${trackingCode}`
                                : `Work Order #${id} berhasil dibuat.`,
                        );
                        if (trackingCode) {
                            document.getElementById("trackingCodeInput").value =
                                trackingCode;
                            trackResult.classList.remove("hidden");
                            trackResult.innerHTML = renderTrackCard({
                                id,
                                trackingCode,
                                status: "pending",
                                requester: payload.requester,
                                device: payload.device,
                                location: payload.location,
                                completedAt: "",
                            });
                            setGuestMode("track");
                            showTrackingCodeModal(trackingCode);
                        }
                    })
                    .catch((error) => {
                        console.error(error);
                        showToast(
                            "Terjadi kesalahan saat membuat work order.",
                            true,
                        );
                    })
                    .finally(() => setLoading(false));
            });
            renderTrackedOrders();
        </script>
    </body>
</html>
