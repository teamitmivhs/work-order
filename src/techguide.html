<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TechGuide - Work Instructions</title>
        <link rel="icon" type="image/x-icon" href="/static/public/itlogo.ico" />
        <link rel="icon" type="image/png" href="/static/public/itlogo.png" />
        <script data-cfasync="false" src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link href="/static/assets/style.css?v=20260715-1" rel="stylesheet" />
        <script
            data-cfasync="false"
            src="/static/assets/theme.js?v=20260719-1"
        ></script>
        <style>
            :root {
                --guide-ink: #0f172a;
                --guide-muted: #64748b;
                --guide-line: rgba(148, 163, 184, 0.22);
                --guide-card: rgba(255, 255, 255, 0.92);
                --guide-blue: #2563eb;
                --guide-blue-soft: #eff6ff;
                --guide-shadow: 0 16px 44px rgba(15, 23, 42, 0.08);
                --guide-shadow-soft: 0 10px 28px rgba(15, 23, 42, 0.06);
            }

            html[data-theme="dark"] {
                --guide-ink: #f1f5f9;
                --guide-muted: #94a3b8;
                --guide-line: rgba(71, 85, 105, 0.72);
                --guide-card: rgba(15, 23, 42, 0.92);
                --guide-blue: #60a5fa;
                --guide-blue-soft: rgba(59, 130, 246, 0.12);
                --guide-shadow: 0 16px 44px rgba(0, 0, 0, 0.24);
                --guide-shadow-soft: 0 10px 28px rgba(0, 0, 0, 0.2);
            }

            * {
                -webkit-tap-highlight-color: transparent;
            }
            html {
                scroll-behavior: smooth;
            }

            body {
                font-family: "Poppins", sans-serif;
                color: var(--guide-ink);
                background: #f1f5f9;
                min-height: 100dvh;
            }

            html[data-theme="dark"] body {
                background: #0b1120;
            }

            body::before {
                content: none;
            }

            .guide-nav {
                background: rgba(2, 6, 23, 0.9);
                border-bottom: 1px solid rgba(148, 163, 184, 0.16);
                box-shadow: 0 10px 26px rgba(2, 6, 23, 0.14);
                backdrop-filter: blur(20px);
            }

            .glass-card {
                background: var(--guide-card);
                border: 1px solid rgba(226, 232, 240, 0.9);
                border-radius: 1rem;
                box-shadow: none;
            }

            .guide-hero {
                position: relative;
                overflow: hidden;
                background: #111827;
                border: 1px solid rgba(148, 163, 184, 0.22);
                box-shadow: none;
            }

            .guide-hero::after {
                content: none;
            }

            .hero-grid {
                display: none;
            }

            .guide-workspace {
                display: grid;
                grid-template-columns: 16rem minmax(0, 1fr);
                align-items: start;
                gap: 1rem;
            }

            .device-picker {
                position: sticky;
                top: 5.25rem;
            }

            .device-list {
                display: flex;
                flex-direction: column;
                gap: 0.45rem;
            }

            .icon-mask {
                display: inline-block;
                width: 1.05rem;
                height: 1.05rem;
                flex: 0 0 auto;
                background: currentColor;
                -webkit-mask: var(--icon) center / contain no-repeat;
                mask: var(--icon) center / contain no-repeat;
            }

            .device-pill {
                display: inline-flex;
                align-items: center;
                justify-content: flex-start;
                gap: 0.45rem;
                width: 100%;
                min-height: 44px;
                padding: 0.7rem 0.8rem;
                border-radius: 0.7rem;
                font-size: 0.78rem;
                font-weight: 700;
                background: #f8fafc;
                color: #475569;
                border: 1px solid rgba(203, 213, 225, 0.9);
                cursor: pointer;
                transition:
                    transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                    background 0.18s,
                    color 0.18s,
                    border-color 0.18s,
                    box-shadow 0.18s;
                white-space: nowrap;
            }

            .device-pill:hover {
                transform: none;
                background: #fff;
                border-color: rgba(96, 165, 250, 0.48);
                box-shadow: none;
            }

            .device-pill.active {
                color: #fff;
                border-color: #1d4ed8;
                background: #2563eb;
                box-shadow: none;
            }

            .guide-content-item {
                animation: fadeUp 0.34s ease both;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .guide-summary-card {
                position: relative;
                overflow: hidden;
                background: #ffffff;
                border: 1px solid rgba(226, 232, 240, 0.86);
                border-radius: 1rem;
                box-shadow: none;
            }

            html[data-theme="dark"] .guide-summary-card {
                background: rgba(15, 23, 42, 0.92);
                border-color: var(--guide-line);
            }

            .step-card {
                position: relative;
                background: transparent;
                border: 0;
                border-bottom: 1px solid rgba(226, 232, 240, 0.86);
                border-radius: 0;
                padding: 1.2rem;
                box-shadow: none;
                transition:
                    background 0.18s,
                    border-color 0.18s;
            }

            .step-card:last-child {
                border-bottom: 0;
            }

            .step-card:hover {
                transform: none;
                background: rgba(239, 246, 255, 0.7);
            }

            .sop-purpose {
                color: var(--guide-muted);
                font-size: 0.875rem;
                line-height: 1.7;
            }

            .prep-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 0.55rem;
            }

            .prep-item {
                display: flex;
                align-items: flex-start;
                gap: 0.5rem;
                min-width: 0;
                padding: 0.7rem;
                border: 1px solid rgba(203, 213, 225, 0.85);
                border-radius: 0.7rem;
                background: #f8fafc;
                color: #475569;
                font-size: 0.75rem;
                line-height: 1.55;
            }

            .sop-warning {
                border-left: 3px solid #f59e0b;
                border-radius: 0.6rem;
                background: #fffbeb;
                color: #92400e;
                padding: 0.75rem 0.85rem;
                font-size: 0.76rem;
                line-height: 1.65;
            }

            .step-flow {
                position: relative;
                overflow: hidden;
                background: #ffffff;
                border: 1px solid rgba(226, 232, 240, 0.9);
                border-radius: 1rem;
            }

            .step-verify {
                display: flex;
                align-items: flex-start;
                gap: 0.45rem;
                margin-top: 0.7rem;
                padding-top: 0.7rem;
                border-top: 1px dashed rgba(148, 163, 184, 0.35);
                color: #475569;
                font-size: 0.76rem;
                line-height: 1.6;
            }

            .step-card code {
                border-radius: 0.3rem;
                background: #e2e8f0;
                color: #0f172a;
                padding: 0.08rem 0.3rem;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 0.78rem;
            }

            html[data-theme="dark"] .glass-card {
                background: rgba(15, 23, 42, 0.92) !important;
                border-color: rgba(71, 85, 105, 0.76) !important;
                box-shadow: none !important;
            }

            html[data-theme="dark"] .device-pill {
                background: rgba(15, 23, 42, 0.92) !important;
                color: #cbd5e1 !important;
                border-color: rgba(71, 85, 105, 0.84) !important;
                box-shadow: none !important;
            }

            html[data-theme="dark"] .device-pill:hover {
                background: rgba(51, 65, 85, 0.94) !important;
                color: #f8fafc !important;
                border-color: rgba(96, 165, 250, 0.68) !important;
            }

            html[data-theme="dark"] .device-pill.active {
                color: #ffffff !important;
                border-color: #2563eb !important;
                background: #1d4ed8 !important;
                box-shadow: none !important;
            }

            html[data-theme="dark"] .step-card {
                background: transparent !important;
                border-color: rgba(71, 85, 105, 0.78) !important;
                box-shadow: none !important;
            }

            html[data-theme="dark"] .step-card:hover {
                background: rgba(30, 41, 59, 0.72) !important;
                box-shadow: none !important;
            }

            html[data-theme="dark"] .step-flow {
                background: rgba(15, 23, 42, 0.94);
                border-color: rgba(71, 85, 105, 0.78);
            }

            html[data-theme="dark"] .prep-item {
                background: rgba(30, 41, 59, 0.8);
                border-color: rgba(71, 85, 105, 0.78);
                color: #cbd5e1;
            }

            html[data-theme="dark"] .sop-warning {
                background: rgba(120, 53, 15, 0.22);
                color: #fcd34d;
            }

            html[data-theme="dark"] .step-verify {
                border-color: rgba(100, 116, 139, 0.48);
                color: #94a3b8;
            }

            html[data-theme="dark"] .step-card code {
                background: #334155;
                color: #f8fafc;
            }

            html[data-theme="dark"] .step-card .bg-blue-50 {
                background-color: rgba(59, 130, 246, 0.16) !important;
            }

            html[data-theme="dark"] .guide-summary-card .bg-slate-50 {
                background-color: rgba(15, 23, 42, 0.92) !important;
                border-color: rgba(71, 85, 105, 0.78) !important;
            }

            html[data-theme="dark"] .guide-summary-card .bg-blue-50\/70 {
                background-color: rgba(37, 99, 235, 0.14) !important;
                border-color: rgba(96, 165, 250, 0.3) !important;
            }

            html[data-theme="dark"] .glass-card .text-slate-900,
            html[data-theme="dark"] .guide-summary-card .text-slate-900,
            html[data-theme="dark"] .step-card .text-slate-900 {
                color: #f8fafc !important;
            }

            html[data-theme="dark"] .glass-card .text-slate-700,
            html[data-theme="dark"] .glass-card .text-slate-600,
            html[data-theme="dark"] .guide-summary-card .text-slate-600,
            html[data-theme="dark"] .step-card .text-slate-600 {
                color: #cbd5e1 !important;
            }

            html[data-theme="dark"] .glass-card .text-slate-500,
            html[data-theme="dark"] .guide-summary-card .text-slate-500 {
                color: #94a3b8 !important;
            }

            html[data-theme="dark"] .glass-card .text-blue-600,
            html[data-theme="dark"] .guide-summary-card .text-blue-600 {
                color: #60a5fa !important;
            }

            html[data-theme="dark"] .guide-summary-card .text-blue-700,
            html[data-theme="dark"] .step-card .text-blue-700 {
                color: #93c5fd !important;
            }

            .guide-brand-icon,
            .guide-device-icon {
                background: #2563eb !important;
                box-shadow: none !important;
            }

            html[data-theme="dark"] .guide-brand-icon,
            html[data-theme="dark"] .guide-device-icon {
                background: #1d4ed8 !important;
                border: 1px solid rgba(96, 165, 250, 0.35);
            }

            .summary-icon {
                display: inline-block;
                width: 1.8rem;
                height: 1.8rem;
                background: currentColor;
                -webkit-mask: var(--icon) center / contain no-repeat;
                mask: var(--icon) center / contain no-repeat;
            }

            .step-number {
                display: inline-flex;
                width: 2.35rem;
                height: 2.35rem;
                align-items: center;
                justify-content: center;
                flex: 0 0 auto;
                border-radius: 0.95rem;
                color: #fff;
                font-size: 0.78rem;
                font-weight: 800;
                background: #1d4ed8;
                box-shadow: none;
            }

            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }

            .step-flow {
                position: relative;
            }

            .step-flow::before {
                content: none;
            }

            .step-check {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 2rem;
                height: 2rem;
                flex: 0 0 auto;
                border-radius: 999px;
                border: 2px solid rgba(148, 163, 184, 0.55);
                background: transparent;
                color: transparent;
                cursor: pointer;
                transition:
                    border-color 0.18s,
                    background 0.18s,
                    color 0.18s,
                    transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
            }

            .step-check:hover {
                border-color: #22c55e;
                color: rgba(34, 197, 94, 0.6);
                transform: scale(1.06);
            }

            .step-card.done .step-check {
                background: #16a34a;
                border-color: #16a34a;
                color: #fff;
            }

            .step-card.done {
                background: rgba(240, 253, 244, 0.7);
            }

            .step-card.done .step-number {
                background: #16a34a;
            }

            .step-card.done p {
                opacity: 0.75;
            }

            .step-done-badge {
                display: none;
                align-items: center;
                gap: 0.25rem;
                border-radius: 999px;
                background: rgba(34, 197, 94, 0.14);
                color: #15803d;
                padding: 0.1rem 0.55rem;
                font-size: 10px;
                font-weight: 800;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            .step-card.done .step-done-badge {
                display: inline-flex;
            }

            html[data-theme="dark"] .step-check {
                border-color: rgba(100, 116, 139, 0.7);
            }

            html[data-theme="dark"] .step-done-badge {
                color: #4ade80;
                background: rgba(34, 197, 94, 0.16);
            }

            html[data-theme="dark"] .step-card.done {
                background: rgba(20, 83, 45, 0.18) !important;
            }

            .progress-track {
                height: 0.55rem;
                border-radius: 999px;
                background: rgba(148, 163, 184, 0.24);
                overflow: hidden;
            }

            .progress-fill {
                height: 100%;
                border-radius: 999px;
                background: #2563eb;
                transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            }

            .progress-fill.complete {
                background: #16a34a;
            }

            html[data-theme="dark"] .progress-track {
                background: rgba(71, 85, 105, 0.55);
            }

            .guide-action-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.4rem;
                min-height: 44px;
                border-radius: 0.8rem;
                border: 1px solid rgba(203, 213, 225, 0.9);
                background: #f8fafc;
                color: #475569;
                font-size: 0.78rem;
                font-weight: 700;
                cursor: pointer;
                transition:
                    background 0.18s,
                    color 0.18s,
                    border-color 0.18s;
            }

            .guide-action-btn:hover {
                background: #fff;
                border-color: rgba(96, 165, 250, 0.48);
            }

            .device-pill:focus-visible,
            .step-check:focus-visible,
            .guide-action-btn:focus-visible,
            .guide-nav a:focus-visible {
                outline: 3px solid rgba(96, 165, 250, 0.75);
                outline-offset: 2px;
            }

            html[data-theme="dark"] .guide-action-btn {
                background: rgba(15, 23, 42, 0.92);
                color: #cbd5e1;
                border-color: rgba(71, 85, 105, 0.84);
            }

            html[data-theme="dark"] .guide-action-btn:hover {
                background: rgba(51, 65, 85, 0.94);
                color: #f8fafc;
            }

            @media print {
                .guide-nav,
                .guide-hero,
                .device-picker,
                .step-check,
                .no-print {
                    display: none !important;
                }
                body {
                    background: #fff !important;
                }
                body::before {
                    display: none;
                }
                #techGuideContent {
                    display: block;
                }
                .step-flow {
                    display: block;
                    border: 0;
                }
                .guide-summary-card {
                    position: static;
                    box-shadow: none;
                    border: 1px solid #e2e8f0;
                    margin-bottom: 1rem;
                }
                .step-flow::before {
                    display: none;
                }
                .step-card {
                    box-shadow: none;
                    border: 1px solid #e2e8f0;
                    break-inside: avoid;
                    margin-bottom: 0.75rem;
                }
                .guide-content-item {
                    animation: none !important;
                    opacity: 1 !important;
                    transform: none !important;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                html {
                    scroll-behavior: auto;
                }
                .guide-content-item {
                    animation: none;
                }
            }

            @media (max-width: 1023px) {
                button,
                a,
                select {
                    min-height: 44px;
                }
                select {
                    font-size: 16px !important;
                }
                .glass-card,
                .guide-summary-card {
                    border-radius: 1rem;
                }
                .step-check {
                    width: 2.75rem;
                    height: 2.75rem;
                }
                main {
                    padding-top: 0.9rem !important;
                }
                .guide-hero {
                    margin-bottom: 0.9rem !important;
                    padding: 1.15rem !important;
                }
                .guide-hero h1 {
                    font-size: 1.55rem !important;
                    line-height: 1.3 !important;
                }
                .hero-chip {
                    margin-bottom: 0.6rem !important;
                }
                .hero-desc {
                    margin-top: 0.55rem !important;
                    line-height: 1.6 !important;
                }
                .hero-stats {
                    display: none !important;
                }
                .device-picker {
                    position: static;
                    margin-bottom: 0.9rem !important;
                    padding: 0.95rem !important;
                }
                .guide-workspace {
                    display: block;
                }
                .device-list {
                    flex-direction: row;
                    overflow-x: auto;
                    padding-bottom: 0.2rem;
                }
                .device-pill {
                    width: auto;
                    flex: 0 0 auto;
                }
                .device-picker .device-list {
                    margin-top: 0.65rem !important;
                }
                #techGuideContent {
                    gap: 0.75rem !important;
                }
                .guide-summary-card {
                    padding: 1rem !important;
                }
                .guide-summary-card .mb-5 {
                    margin-bottom: 0.75rem !important;
                }
                .guide-summary-card .mt-4 {
                    margin-top: 0.75rem !important;
                }
                .sop-stat-tiles {
                    display: none !important;
                }
                .prep-grid {
                    grid-template-columns: 1fr;
                }
                .sop-reminder {
                    padding: 0.8rem !important;
                }
                .step-card > div {
                    flex-wrap: wrap;
                }
                .step-card .step-check {
                    order: 2;
                    margin-left: auto;
                }
                .step-card .min-w-0 {
                    order: 3;
                    flex-basis: 100%;
                    min-width: 100%;
                    margin-top: 0.3rem;
                }
            }
        </style>
    </head>
    <body>
        <a
            href="#main-content"
            class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:text-slate-900"
        >
            Lewati ke panduan
        </a>
        <nav class="guide-nav sticky top-0 z-40 w-full px-4 md:px-6 py-3">
            <div
                class="mx-auto flex max-w-6xl items-center justify-between gap-3"
            >
                <a
                    href="/"
                    class="inline-flex min-h-[44px] items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3.5 text-sm font-semibold text-slate-100 no-underline transition hover:bg-white/10 hover:text-sky-200"
                >
                    <svg
                        class="h-4 w-4 flex-shrink-0"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M15 19l-7-7 7-7"
                        ></path>
                    </svg>
                    Kembali
                </a>
                <div class="flex items-center gap-2 text-white">
                    <span
                        class="guide-brand-icon inline-flex h-9 w-9 items-center justify-center rounded-2xl bg-blue-600 text-white"
                    >
                        <span
                            class="icon-mask"
                            style="
                                --icon: url(&quot;https://api.iconify.design/lucide/book-open-check.svg&quot;);
                            "
                        ></span>
                    </span>
                    <div class="leading-tight">
                        <p class="text-sm font-bold">TechGuide</p>
                        <p
                            class="hidden text-[11px] font-medium text-slate-400 sm:block"
                        >
                            Work Instructions
                        </p>
                    </div>
                </div>
                <div class="w-[86px]"></div>
            </div>
        </nav>

        <main
            id="main-content"
            class="mx-auto max-w-7xl px-4 py-5 md:px-6 md:py-7"
        >
            <section
                class="guide-hero mb-4 rounded-2xl p-5 text-white md:p-6"
            >
                <div class="hero-grid"></div>
                <div
                    class="relative z-10 flex flex-col gap-5 md:flex-row md:items-end md:justify-between"
                >
                    <div>
                        <p
                            class="hero-chip mb-2 text-xs font-bold uppercase tracking-[0.18em] text-blue-300"
                        >
                            SOP operasional IT MIVHS
                        </p>
                        <h1
                            class="max-w-3xl text-3xl font-extrabold tracking-[-0.045em] text-white md:text-4xl"
                        >
                            Panduan teknis lapangan
                        </h1>
                        <p
                            class="hero-desc mt-2 max-w-2xl text-sm leading-6 text-slate-300"
                        >
                            Pilih perangkat, siapkan kebutuhan kerja, ikuti
                            prosedur, lalu cocokkan hasil verifikasi sebelum
                            menutup work order.
                        </p>
                    </div>
                    <div
                        class="hero-stats flex gap-5 border-l border-white/15 pl-5"
                    >
                        <div>
                            <p
                                class="text-xl font-extrabold"
                                id="heroDeviceCount"
                            >
                                8
                            </p>
                            <p class="text-[11px] text-slate-400">Kategori</p>
                        </div>
                        <div>
                            <p
                                class="text-xl font-extrabold"
                                id="heroStepCount"
                            >
                                5
                            </p>
                            <p class="text-[11px] text-slate-400">
                                Langkah aktif
                            </p>
                        </div>
                    </div>
                </div>
            </section>

            <div class="guide-workspace">
                <aside class="device-picker glass-card p-3" aria-label="Perangkat">
                    <div>
                        <p
                            class="px-2 text-[11px] font-extrabold uppercase tracking-[0.16em] text-blue-600"
                        >
                            Pilih perangkat
                        </p>

                                "Hapus job yang gagal, pastikan printer tidak Paused/Offline, lalu uji ping ke IP printer atau pindahkan kabel USB. Gunakan driver resmi sesuai model dan pilih port/IP yang benar; cetak test page dari Windows.",
                            check:
                                "Queue kosong, status Ready, dan test page Windows serta dokumen pengguna berhasil dicetak.",

                    ],
                },
                "Kabel LAN": {

                    title: "Kabel LAN — SOP Pemeriksaan",
                    purpose:

                    before: [

                        "LAN tester, kabel pembanding, serta tang crimp",
                        "Akses ke gateway atau server uji internal",
                    ],
                    warning:
                        "Jangan mencabut uplink atau port perangkat lain tanpa memastikan label dan dampaknya.",
                    steps: [

                            content:
                                "Pasang kembali sampai terdengar klik dan cek LED link pada endpoint serta switch. Lihat alamat dengan <code>ipconfig /all</code> di Windows atau <code>ip address</code> di Linux; catat apakah DHCP memberikan IP, gateway, dan DNS.",
                            check:
                                "Link menyala dan endpoint memperoleh konfigurasi jaringan yang sesuai VLAN.",
                        },
                        {
                            step: 3,
                            title: "Uji Wire Map",
                            content:
                                "Lepaskan jalur dari perangkat aktif, pasang kedua sisi LAN tester, lalu baca pin 1–8. Urutan harus sama dan tidak menunjukkan open, short, reverse, atau split pair.",
                            check:
                                "Semua delapan pin lolos berurutan pada kedua ujung.",

                        {

                            check:
                                "Wire map hasil perbaikan lulus dan konektor terkunci kuat.",
                        },
                        {
                            step: 5,
                            title: "Validasi Koneksi End-to-End",
                            content:
                                "Sambungkan endpoint, cek link speed, lalu uji <code>ping &lt;gateway&gt;</code>, resolusi DNS, server internal, dan aplikasi yang dilaporkan. Catat outlet, port switch, hasil tester, serta hasil uji akhir.",
                            check:
                                "Endpoint mencapai gateway dan layanan tujuan tanpa packet loss yang tidak wajar.",

            const PROGRESS_KEY = "techguideProgress";

            function readProgress() {
                try {
                    return (
                        JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}
                    );
                } catch (e) {
                    return {};
                }
            }

            function getDone(device) {
                return new Set(readProgress()[device] || []);
            }

            function saveDone(device, doneSet) {
                try {
                    const all = readProgress();
                    all[device] = Array.from(doneSet);
                    localStorage.setItem(PROGRESS_KEY, JSON.stringify(all));
                } catch (e) {}
            }

            function updateProgressUI(device) {
                const guide = techGuides[device];
                if (!guide) return;
                const done = getDone(device);
                let count = 0;
                document
                    .querySelectorAll("#techGuideContent .step-card")
                    .forEach((card) => {
                        const isDone = done.has(Number(card.dataset.step));
                        if (isDone) count++;
                        card.classList.toggle("done", isDone);
                        const btn = card.querySelector(".step-check");
                        if (btn)
                            btn.setAttribute("aria-pressed", String(isDone));
                    });
                const total = guide.steps.length;
                const pct = total ? Math.round((count / total) * 100) : 0;
                const fill = document.getElementById("guideProgressFill");
                const label = document.getElementById("guideProgressLabel");
                if (fill) {
                    fill.style.width = pct + "%";
                    fill.classList.toggle("complete", pct === 100);
                    fill.setAttribute("aria-valuenow", String(pct));
                }
                if (label)
                    label.textContent =
                        pct === 100
                            ? "Semua langkah selesai"
                            : count + "/" + total + " selesai";
            }

            function toggleStep(device, stepNo) {
                const done = getDone(device);
                if (done.has(stepNo)) {
                    done.delete(stepNo);
                } else {
                    done.add(stepNo);
                }
                saveDone(device, done);
                updateProgressUI(device);
            }

            function renderTechGuide(device) {
                const guide = techGuides[device];
                const contentDiv = document.getElementById("techGuideContent");
                if (!guide) {
                    contentDiv.innerHTML =
                        '<p class="text-sm text-slate-500">Panduan tidak tersedia untuk perangkat ini.</p>';
                    return;
                }

                document.getElementById("heroStepCount").textContent =
                    guide.steps.length;
                document.getElementById("heroDeviceCount").textContent =
                    Object.keys(techGuides).length;

                const stepsMarkup = guide.steps
                    .map(
                        (step, index) => `
        <article class="guide-content-item step-card" data-step="${step.step}" style="animation-delay:${index * 45}ms">
          <div class="flex items-start gap-3 md:gap-4">
            <span class="step-number">${String(step.step).padStart(2, "0")}</span>
            <div class="min-w-0 flex-1">
              <div class="mb-1 flex flex-wrap items-center gap-2">
                <h3 class="text-sm font-bold text-slate-900 md:text-base">${step.title}</h3>
                <span class="step-done-badge">Selesai</span>
              </div>
              <p class="text-sm leading-7 text-slate-600">${step.content}</p>
              <div class="step-verify">
                <svg class="mt-0.5 h-4 w-4 flex-none text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path>
                </svg>
                <span><strong>Hasil verifikasi:</strong> ${step.check}</span>
              </div>
            </div>
            <button type="button" class="step-check" aria-pressed="false" aria-label="Tandai langkah ${step.step} selesai">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
              </svg>
            </button>
          </div>
        </article>`,
                    )
                    .join("");

                const beforeMarkup = guide.before
                    .map(
                        (item) => `
              <div class="prep-item">
                <svg class="mt-0.5 h-4 w-4 flex-none text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"></path>
                </svg>
                <span>${item}</span>
              </div>`,
                    )
                    .join("");

                contentDiv.innerHTML = `
        <section class="guide-summary-card p-5 md:p-6">
          <div class="flex items-start gap-3 md:gap-4">
            <div class="guide-device-icon flex h-12 w-12 flex-none items-center justify-center rounded-xl bg-blue-600 text-white md:h-14 md:w-14">
              <span class="summary-icon" style="--icon: url('${guide.icon}')"></span>
            </div>
            <div class="min-w-0">
              <p class="text-[11px] font-extrabold uppercase tracking-[0.16em] text-blue-600">SOP aktif</p>
              <h2 class="mt-1 text-xl font-extrabold tracking-[-0.04em] text-slate-900 md:text-2xl">${guide.title}</h2>
              <p class="sop-purpose mt-2">${guide.purpose}</p>
            </div>
          </div>

          <div class="mt-5 border-t border-slate-200 pt-4">
            <p class="mb-2 text-[11px] font-extrabold uppercase tracking-[0.14em] text-slate-500">Siapkan sebelum mulai</p>
            <div class="prep-grid">${beforeMarkup}</div>
          </div>

          ${
              guide.warning
                  ? `<div class="sop-warning mt-4"><strong>Perhatian:</strong> ${guide.warning}</div>`
                  : ""
          }

          <div class="mt-5 flex flex-col gap-3 border-t border-slate-200 pt-4 sm:flex-row sm:items-end">
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <p class="text-[11px] font-extrabold uppercase tracking-[0.14em] text-slate-500">Progress</p>
                <p id="guideProgressLabel" class="text-xs font-bold text-slate-600">0/${guide.steps.length} selesai</p>
              </div>
              <div class="progress-track mt-2">
                <div id="guideProgressFill" class="progress-fill" role="progressbar" aria-label="Progress SOP" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="width:0%"></div>
              </div>
            </div>
            <div class="no-print grid grid-cols-2 gap-2 sm:w-56">
              <button type="button" id="guideResetBtn" class="guide-action-btn">
                <span class="icon-mask" style="--icon: url('https://api.iconify.design/lucide/rotate-ccw.svg')"></span>Reset
              </button>
              <button type="button" id="guidePrintBtn" class="guide-action-btn">
                <span class="icon-mask" style="--icon: url('https://api.iconify.design/lucide/printer.svg')"></span>Print SOP
              </button>
            </div>
          </div>
        </section>

        <div class="mb-3 mt-5 flex items-end justify-between gap-3 px-1">
          <div>
            <p class="text-[11px] font-extrabold uppercase tracking-[0.15em] text-blue-600">Prosedur kerja</p>
            <h2 class="mt-1 text-lg font-bold text-slate-900">Kerjakan berurutan</h2>
          </div>
          <p class="text-xs font-semibold text-slate-500">${guide.steps.length} langkah</p>
        </div>
        <div class="step-flow">
          ${stepsMarkup}
        </div>`;

                contentDiv.querySelectorAll(".step-check").forEach((btn) => {
                    btn.addEventListener("click", function () {
                        toggleStep(
                            device,
                            Number(this.closest(".step-card").dataset.step),
                        );
                    });
                });
                document
                    .getElementById("guideResetBtn")
                    .addEventListener("click", function () {
                        saveDone(device, new Set());
                        updateProgressUI(device);
                    });
                document
                    .getElementById("guidePrintBtn")
                    .addEventListener("click", function () {
                        window.print();
                    });

                updateProgressUI(device);
            }

            function setDevice(device) {
                document.querySelectorAll(".device-pill").forEach((p) => {
                    const active = p.dataset.device === device;
                    p.classList.toggle("active", active);
                    p.setAttribute("aria-pressed", String(active));
                });
                renderTechGuide(device);
            }

            let printPrevTheme = null;
            window.addEventListener("beforeprint", function () {
                printPrevTheme =
                    document.documentElement.getAttribute("data-theme");
                document.documentElement.setAttribute("data-theme", "light");
            });
            window.addEventListener("afterprint", function () {
                if (printPrevTheme)
                    document.documentElement.setAttribute(
                        "data-theme",
                        printPrevTheme,
                    );
            });

            document.addEventListener("DOMContentLoaded", function () {
                const activePill = document.querySelector(
                    ".device-pill.active",
                );
                if (activePill) setDevice(activePill.dataset.device);
                document.querySelectorAll(".device-pill").forEach((pill) => {
                    pill.addEventListener("click", function () {
                        setDevice(this.dataset.device);
                    });
                });
            });
        </script>
    </body>
</html>
