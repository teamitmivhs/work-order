<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechGuide - Work Instructions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="/static/assets/style.css" rel="stylesheet" />
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .guide-content-item { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Step card accent */
    .step-card {
      background: #fff;
      border-left: 4px solid #3b82f6;
      border-radius: 0 0.75rem 0.75rem 0;
      padding: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: box-shadow 0.2s;
    }
    .step-card:hover { box-shadow: 0 4px 12px rgba(59,130,246,0.12); }

    /* Device selector pills on mobile */
    .device-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      background: #f1f5f9;
      color: #475569;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .device-pill:hover { background: #e2e8f0; }
    .device-pill.active {
      background: rgba(59,130,246,0.12);
      color: #1d4ed8;
      border-color: rgba(59,130,246,0.4);
    }
  </style>
</head>
<body class="bg-[#f3f4f6]">

  <!-- NAVBAR -->
  <nav style="background:linear-gradient(to right,#0f172a,#1e293b);border-bottom:1px solid rgba(255,255,255,0.07);"
    class="sticky top-0 z-40 w-full px-4 md:px-6 py-3 shadow-2xl flex items-center justify-between">
    <a href="/index.html" class="flex items-center gap-2 text-white hover:text-blue-300 transition-colors min-h-[44px]">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
      </svg>
      <span class="text-sm font-medium">Kembali</span>
    </a>
    <h1 class="text-white text-base sm:text-lg font-bold absolute left-1/2 -translate-x-1/2 whitespace-nowrap">TechGuide</h1>
    <div class="w-16"></div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="px-4 md:px-10 py-6 md:py-8 max-w-4xl mx-auto">

    <!-- Device selector: dropdown on mobile, hidden select replaced by pill scroller -->
    <div class="bg-white rounded-xl md:rounded-2xl shadow-lg md:shadow-xl p-4 md:p-6 mb-4 md:mb-6">
      <label class="block text-sm md:text-lg font-semibold text-gray-800 mb-3" for="techGuideDeviceSelect">
        Pilih Perangkat
      </label>

      <!-- Native select (always visible, good UX on all devices) -->
      <select id="techGuideDeviceSelect"
        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-colors text-sm md:text-base bg-gray-50 font-medium text-gray-700">
        <option value="Server cloud">🖥️ Server Cloud</option>
        <option value="Upgrading PC">⬆️ Upgrading PC</option>
        <option value="Troubleshooting Windows">🪟 Troubleshooting Windows</option>
        <option value="Troubleshooting CCTV">📷 Troubleshooting CCTV</option>
        <option value="Cleaning PC/Laptop">🧹 Cleaning PC/Laptop</option>
        <option value="Printer">🖨️ Printer</option>
        <option value="Kabel LAN">🔌 Kabel LAN</option>
      </select>

      <!-- Quick-pick pill strip (scrollable on mobile) -->
      <div class="flex gap-2 mt-3 overflow-x-auto pb-1 -mx-1 px-1 scrollbar-hide">
        <button class="device-pill active" data-device="Server cloud">Server Cloud</button>
        <button class="device-pill" data-device="Upgrading PC">Upgrading PC</button>
        <button class="device-pill" data-device="Troubleshooting Windows">Windows</button>
        <button class="device-pill" data-device="Troubleshooting CCTV">CCTV</button>
        <button class="device-pill" data-device="Cleaning PC/Laptop">Cleaning</button>
        <button class="device-pill" data-device="Printer">Printer</button>
        <button class="device-pill" data-device="Kabel LAN">LAN</button>
      </div>
    </div>

    <!-- Guide content -->
    <div id="techGuideContent" class="flex flex-col gap-3 md:gap-4"></div>
  </main>

  <script>
    const techGuides = {
      'Server cloud': {
        title: 'Server Cloud — Instruksi Kerja',
        steps: [
          { step: 1, title: 'Server Startup', content: 'Pastikan server terhubung ke sumber daya listrik dan jaringan. Nyalakan server dengan menekan tombol power di casing server.' },
          { step: 2, title: 'Cek Status Sistem', content: 'Masuk menggunakan kredensial admin. Ketik btop untuk memverifikasi penggunaan CPU normal (di bawah 80%) dan penggunaan RAM yang wajar.' },
          { step: 3, title: 'Network Connectivity', content: 'Verifikasi konektivitas jaringan dengan cara ping ke gateway atau ke DNS Google (8.8.8.8). Periksa bahwa semua interface jaringan aktif (ethernet, zerotier) dan menunjukkan status hijau di Network Manager.' },
          { step: 4, title: 'Service Verification', content: 'Restart semua critical service (SQL, Apache2, dll.) menggunakan systemctl. Verifikasi setiap layanan berhasil dijalankan dengan memeriksa statusnya.' },
          { step: 5, title: 'Backup Check', content: 'Verifikasi backup terbaru yang telah selesai. Cek backup log untuk memastikan tidak ada error selama proses backup.' },
        ],
      },
      'Upgrading PC': {
        title: 'Upgrading PC — Instruksi Kerja',
        steps: [
          { step: 1, title: 'Persiapan Pre-Upgrade', content: 'Backup semua data penting ke penyimpanan eksternal. Buat system restore point. Pastikan ruang disk yang cukup tersedia (minimal 20GB).' },
          { step: 2, title: 'Check Hardware Compatibility', content: 'Verifikasi semua komponen hardware kompatibel dengan versi OS baru. Periksa situs web produsen untuk ketersediaan driver.' },
          { step: 3, title: 'Disable Antivirus', content: 'Nonaktifkan sementara software antivirus selama proses upgrade untuk mencegah konflik. Aktifkan kembali segera setelah upgrade selesai.' },
          { step: 4, title: 'Run Upgrade Process', content: 'Download versi terbaru dari sumber resmi. Jalankan installer upgrade dan ikuti semua petunjuk. Jangan hentikan proses.' },
          { step: 5, title: 'Post-Upgrade Verification', content: 'Verifikasi sistem booting dengan normal dan semua aplikasi critical berjalan.' },
        ],
      },
      'Troubleshooting Windows': {
        title: 'Troubleshooting Windows — Instruksi Kerja',
        steps: [
          { step: 1, title: 'System Diagnostics', content: 'Jalankan Windows Disk Check (chkdsk) untuk mengidentifikasi kesalahan sistem file. Periksa Event Viewer untuk kesalahan dan peringatan kritis.' },
          { step: 2, title: 'Memory Test', content: 'Jalankan Windows Memory Diagnostic untuk menguji integritas RAM. Restart sistem dan biarkan siklus pengujian selesai (biasanya memakan waktu lebih dari 30 menit).' },
          { step: 3, title: 'Update & Drivers', content: 'Install driver terbaru dari Windows Update atau situs web produsen. Pastikan semua update Windows telah diinstal.' },
          { step: 4, title: 'Malware Scan', content: 'Jalankan full system scan dengan Windows Defender. Jika belum cukup, gunakan software tambahan seperti Malwarebytes dalam Safe Mode.' },
          { step: 5, title: 'System Cleanup', content: 'Bersihkan temporary file menggunakan Disk Cleanup. Nonaktifkan startup program yang tidak perlu.' },
        ],
      },
      'Troubleshooting CCTV': {
        title: 'Troubleshooting CCTV — Instruksi Kerja',
        steps: [
          { step: 1, title: 'Check Physical Connections', content: 'Periksa semua kabel terhubung dengan kuat. Periksa kerusakan terlihat pada kabel dan konektor BNC.' },
          { step: 2, title: 'Camera Status', content: 'Cek kamera dari monitor. Akses IVMS menggunakan IP address. Verifikasi kamera menerima input video.' },
          { step: 3, title: 'Network Configuration', content: 'Ping alamat IP kamera untuk memverifikasi konektivitas jaringan. Periksa server DHCP untuk IP kamera. Verifikasi port switch jaringan.' },
          { step: 4, title: 'DVR/NVR Check', content: 'Restart sistem DVR/NVR. Verifikasi semua saluran kamera menunjukkan status "Online". Periksa pengaturan perekaman dan ruang penyimpanan.' },
          { step: 5, title: 'Firmware & Software', content: 'Periksa pembaruan firmware yang tersedia untuk kamera dan DVR/NVR. Perbarui jika tersedia. Tinjau log sistem untuk pesan kesalahan.' },
        ],
      },
      'Cleaning PC/Laptop': {
        title: 'Cleaning PC/Laptop — Instruksi Kerja',
        steps: [
          { step: 1, title: 'Power Down & Unplug', content: 'Matikan PC/Laptop dan cabut semua kabel daya dan periferal. Biarkan perangkat dingin selama beberapa menit sebelum membersihkan.' },
          { step: 2, title: 'External Cleaning', content: 'Gunakan kain microfiber yang sedikit dibasahi dengan air atau pembersih layar khusus untuk membersihkan layar. Bersihkan casing luar dengan kain lembab.' },
          { step: 3, title: 'Keyboard & Ports', content: 'Gunakan kaleng udara bertekanan untuk meniup debu dari keyboard dan port. Gunakan cotton bud yang sedikit dibasahi alkohol isopropil untuk membersihkan sela-sela keyboard.' },
          { step: 4, title: 'Internal Cleaning', content: 'Buka casing PC/Laptop sesuai petunjuk produsen. Gunakan contact cleaner untuk membersihkan debu dari komponen internal seperti kipas, heatsink, dan motherboard. Pastikan baterai tercabut.' },
          { step: 5, title: 'Reassemble & Test', content: 'Pasang kembali casing dengan hati-hati. Sambungkan kembali semua kabel. Nyalakan perangkat dan pastikan semuanya berfungsi dengan baik.' },
        ],
      },
      'Printer': {
        title: 'Printer — Instruksi Kerja',
        steps: [
          { step: 1, title: 'Check Connections', content: 'Pastikan printer terhubung ke sumber daya listrik dan komputer. Periksa kabel USB atau koneksi jaringan.' },
          { step: 2, title: 'Paper Jam', content: 'Buka penutup printer dan periksa adanya kertas yang macet. Angkat kertas dengan hati-hati untuk menghindari kerusakan.' },
          { step: 3, title: 'Ink/Toner Levels', content: 'Periksa level tinta atau toner. Ganti cartridge jika levelnya rendah atau habis.' },
          { step: 4, title: 'Print Test Page', content: 'Cetak halaman uji untuk memverifikasi kualitas cetak. Periksa apakah ada garis atau noda pada hasil cetakan.' },
          { step: 5, title: 'Driver Update', content: 'Perbarui driver printer dari situs web produsen. Pastikan kompatibilitas dengan sistem operasi yang digunakan.' },
        ],
      },
      'Kabel LAN': {
        title: 'Kabel LAN — Instruksi Kerja',
        steps: [
          { step: 1, title: 'Physical Inspection', content: 'Periksa kabel LAN untuk kerusakan fisik seperti sobekan, tekukan tajam, atau konektor RJ-45 yang longgar. Ganti kabel jika ditemukan kerusakan yang tidak dapat diperbaiki.' },
          { step: 2, title: 'Connection Check', content: 'Pastikan kedua ujung kabel terhubung dengan baik ke perangkat (komputer, switch, router). Dengarkan bunyi "klik" saat konektor masuk ke port, dan pastikan clip pengunci tidak patah.' },
          { step: 3, title: 'Network Test', content: 'Gunakan LAN tester untuk memeriksa sambungan semua 8 pin (wire map test). Jika ada pin yang tidak terhubung, kabel perlu di-crimp ulang atau diganti. Jika tidak ada LAN tester, lakukan ping ke gateway untuk verifikasi konektivitas dasar.' },
          { step: 4, title: 'Replace if Necessary', content: 'Jika kabel rusak atau tidak berfungsi setelah pengujian, ganti dengan kabel baru yang sesuai spesifikasi (Cat5e untuk 1 Gbps, Cat6 untuk 10 Gbps). Pastikan panjang kabel tidak melebihi 100 meter per segmen.' },
          { step: 5, title: 'Verify Connectivity', content: 'Setelah penggantian, verifikasi konektivitas jaringan dengan melakukan ping ke gateway dan ke server lokal. Periksa kecepatan koneksi menggunakan speed test internal jika tersedia.' },
        ],
      },
    };

    function renderTechGuide(device) {
      const guide = techGuides[device];
      const contentDiv = document.getElementById('techGuideContent');
      if (!guide) {
        contentDiv.innerHTML = '<p class="text-gray-500 text-sm">Panduan tidak tersedia untuk perangkat ini.</p>';
        return;
      }
      // Header card
      let html = `
        <div class="bg-white rounded-xl md:rounded-2xl shadow-lg md:shadow-xl p-4 md:p-6">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
              <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
              </svg>
            </div>
            <div>
              <h2 class="text-base md:text-xl font-bold text-gray-800">${guide.title}</h2>
              <p class="text-xs md:text-sm text-gray-500">${guide.steps.length} langkah</p>
            </div>
          </div>
        </div>`;
      // Step cards
      guide.steps.forEach(step => {
        html += `
        <div class="guide-content-item step-card">
          <div class="flex items-start gap-3">
            <span class="flex-shrink-0 w-7 h-7 rounded-full bg-blue-500 text-white text-xs font-bold flex items-center justify-center mt-0.5">${step.step}</span>
            <div>
              <h3 class="text-sm md:text-base font-semibold text-blue-700 mb-1">${step.title}</h3>
              <p class="text-gray-700 leading-relaxed text-sm">${step.content}</p>
            </div>
          </div>
        </div>`;
      });
      contentDiv.innerHTML = html;
    }

    function setDevice(device) {
      // sync select
      document.getElementById('techGuideDeviceSelect').value = device;
      // sync pills
      document.querySelectorAll('.device-pill').forEach(p => {
        p.classList.toggle('active', p.dataset.device === device);
      });
      renderTechGuide(device);
    }

    document.addEventListener('DOMContentLoaded', function () {
      const select = document.getElementById('techGuideDeviceSelect');
      setDevice(select.value);

      select.addEventListener('change', function () { setDevice(this.value); });

      document.querySelectorAll('.device-pill').forEach(pill => {
        pill.addEventListener('click', function () { setDevice(this.dataset.device); });
      });
    });
  </script>
</body>
</html>
