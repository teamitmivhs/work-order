[package]
name = "rust-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# JSON (request / response)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# FIX: chrono dan uuid dihapus — tidak dipakai di mana pun
# Mengurangi compile time dan ukuran binary
# chrono juga punya history CVE (GHSA-wcg3-cvx6-7396)