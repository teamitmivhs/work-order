<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/assets/style.css" />
</head>
<body class="font-poppins bg-gray-100 flex justify-center items-center min-h-screen p-4">

  <div class="w-full max-w-sm bg-white p-6 sm:p-8 rounded-lg shadow-md text-center">
    <img src="static/public/itlogo.png" alt="IT Logo" class="w-24 mx-auto mb-6" />
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Register</h2>
    <form class="register-form space-y-4">
      <div class="input-group text-left">
        <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
        <input type="text" id="username" name="username" required minlength="3" maxlength="50"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
      </div>
      <div class="input-group text-left">
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required minlength="8"
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
        <p class="text-xs text-gray-500 mt-1">Min 8 karakter, harus ada huruf besar, huruf kecil, dan angka.</p>
      </div>
      <button type="submit"
        class="w-full py-2 px-4 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors">
        Register
      </button>
    </form>
    <p class="text-sm text-gray-600 mt-4">
      Already have an account? <a href="login.html" class="text-blue-600 hover:underline">Login here</a>
    </p>
  </div>

  <!-- Modal — konsisten pakai class hidden -->
  <div id="myModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-40 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg p-6 max-w-sm w-full shadow-xl relative">
      <button class="close absolute top-2 right-4 text-gray-500 hover:text-gray-700 text-2xl font-bold" aria-label="Tutup">&times;</button>
      <p id="modal-message" class="mt-4 text-center text-lg"></p>
    </div>
  </div>

  <script>
    const modal = document.getElementById('myModal');
    const modalMessage = document.getElementById('modal-message');

    function showModal(message) {
      modalMessage.textContent = message;
      modal.classList.remove('hidden');
    }
    function hideModal() {
      modal.classList.add('hidden');
    }

    document.querySelector('.close').addEventListener('click', hideModal);
    modal.addEventListener('click', function (e) {
      if (e.target === modal) hideModal();
    });

    const registerForm = document.querySelector('.register-form');
    if (registerForm) {
      registerForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const submitBtn = registerForm.querySelector('[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.6';

        const name = e.target.username.value;
        const password = e.target.password.value;

        fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, password })
        })
        .then(r => r.json())
        .then(data => {
          if (data.data && data.data.token) {
            showModal('Registration successful! Please log in.');
            setTimeout(() => { window.location.href = 'login.html'; }, 2000);
          } else {
            showModal(data.message || 'Registration failed');
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
          }
        })
        .catch(() => {
          showModal('An error occurred. Please try again.');
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
        });
      });
    }
  </script>
</body>
</html>
